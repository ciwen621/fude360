<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>福德360｜環遊校園</title>
<style>
  * { box-sizing: border-box }
  body { margin: 0; background: #171918; color: #f9f8f4; font: 16px system-ui, "Microsoft JhengHei", sans-serif }
  main { width: min(1280px, 100%); margin: auto; padding: clamp(12px, 3vw, 36px) }
  h1 { margin: 0 0 16px; font-size: clamp(23px, 5vw, 36px) }
  .viewer { position: relative; height: clamp(270px, 62vh, 760px); border-radius: 14px; background: #252825; overflow: hidden }
  canvas { width: 100%; height: 100%; display: block; cursor: grab; touch-action: none }
  canvas:active { cursor: grabbing }
  .scene-label { position: absolute; left: 12px; top: 12px; padding: 7px 12px; background: #151714e8; border-radius: 8px; pointer-events: none }
  .message { position: absolute; inset: 0; display: grid; place-items: center; padding: 20px; pointer-events: none }
  .viewer.has-scene .message { align-items: end; padding: 12px }
  .message[hidden], button[hidden] { display: none }
  #status { max-width: 38ch; margin: 0; padding: 12px 16px; background: #171918ee; border-radius: 8px; text-align: center }
  .controls, nav { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px }
  button { border: 1px solid #595c56; padding: 8px 12px; min-height: 44px; border-radius: 8px; background: #292c27; color: inherit; font: inherit; cursor: pointer }
  button:hover { border-color: #f6d56d }
  button[aria-pressed="true"] { background: #f6d56d; border-color: #f6d56d; color: #242011; font-weight: 700 }
  button:focus-visible, canvas:focus-visible { outline: 2px solid #f6d56d; outline-offset: -3px }
  .hint { margin: 12px 0 0; color: #d5d6cd; font-size: 14px }
  .viewer:fullscreen { height: 100%; width: 100%; border-radius: 0 }
</style>
</head>
<body>
<main>
  <h1>福德360｜環遊校園</h1>
  <div id="viewer" class="viewer">
    <canvas id="view" tabindex="0" aria-label="360° 全景。可拖曳或用方向鍵旋轉。"></canvas>
    <div id="scene-label" class="scene-label">A｜上學校門</div>
    <div id="message" class="message"><p id="status" role="status">正在啟動播放器…</p></div>
  </div>
  <nav id="scenes" aria-label="切換校園場景"></nav>
  <div class="controls">
    <button id="zoom-in" type="button">放大</button>
    <button id="zoom-out" type="button">縮小</button>
    <button id="reset" type="button">回到起點</button>
    <button id="fullscreen" type="button" hidden>全螢幕</button>
  </div>
  <p class="hint">拖曳或滑動環視 · 滾輪或雙指縮放</p>
  <noscript>請允許 JavaScript 執行，以便觀看 360° 全景。</noscript>
</main>
<script>
(() => {
  "use strict";
  const scenes = [{"label": "A｜上學校門", "file": "A.jpg"}, {"label": "B｜一樓聯絡走廊", "file": "B.jpg"}, {"label": "C｜前庭花園", "file": "C.jpg"}, {"label": "D｜中庭花園", "file": "D.jpg"}, {"label": "E｜小田園", "file": "E.jpg"}, {"label": "F｜操場三年級", "file": "F.jpg"}, {"label": "G｜幼兒園", "file": "G.jpg"}, {"label": "H｜二樓看操場", "file": "H.jpg"}];
  const viewer = document.querySelector("#viewer");
  const canvas = document.querySelector("#view");
  const sceneLabel = document.querySelector("#scene-label");
  const message = document.querySelector("#message");
  const status = document.querySelector("#status");
  const sceneList = document.querySelector("#scenes");
  function showMessage(text) {
    status.textContent = text;
    message.hidden = !text;
  }
  const gl = canvas.getContext("webgl", {alpha: false, antialias: false});
  if (!gl) {
    showMessage("瀏覽器目前無法啟用 WebGL。請用 Chrome 或 Edge 開啟，並檢查瀏覽器的圖形加速設定。");
    return;
  }
  const vertex = "attribute vec2 pos;varying vec2 uv;void main(){uv=pos*.5+.5;gl_Position=vec4(pos,0.,1.);}";
  const fragment = "precision highp float;varying vec2 uv;uniform sampler2D pano;uniform vec2 resolution;uniform float yaw;uniform float pitch;uniform float fov;const float PI=3.141592653589793;void main(){vec2 xy=uv*2.-1.;xy.x*=resolution.x/resolution.y;float focal=1./tan(fov*.5);vec3 ray=normalize(vec3(xy.x,xy.y,focal));float cp=cos(pitch),sp=sin(pitch);ray=vec3(ray.x,ray.y*cp+ray.z*sp,-ray.y*sp+ray.z*cp);float cy=cos(yaw),sy=sin(yaw);ray=vec3(ray.x*cy+ray.z*sy,ray.y,-ray.x*sy+ray.z*cy);float lon=atan(ray.x,ray.z);float lat=asin(clamp(ray.y,-1.,1.));vec2 tex=vec2(fract(.5+lon/(2.*PI)),clamp(.5-lat/PI,0.,1.));gl_FragColor=texture2D(pano,tex);}";
  function compile(type, source) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
      throw new Error(gl.getShaderInfoLog(shader));
    }
    return shader;
  }

  const program = gl.createProgram();
  try {
    gl.attachShader(program, compile(gl.VERTEX_SHADER, vertex));
    gl.attachShader(program, compile(gl.FRAGMENT_SHADER, fragment));
    gl.linkProgram(program);
    if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
      throw new Error(gl.getProgramInfoLog(program));
    }
  } catch (error) {
    showMessage("播放器啟動失敗：" + error.message);
    return;
  }
  gl.useProgram(program);
  const quad = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, quad);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
  const position = gl.getAttribLocation(program, "pos");
  gl.enableVertexAttribArray(position);
  gl.vertexAttribPointer(position, 2, gl.FLOAT, false, 0, 0);
  const uniforms = Object.fromEntries(["resolution", "yaw", "pitch", "fov"].map(
    key => [key, gl.getUniformLocation(program, key)]
  ));
  gl.uniform1i(gl.getUniformLocation(program, "pano"), 0);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);

  const startFov = 1.25;
  let yaw = 0;
  let pitch = 0;
  let fov = startFov;
  let texture = null;
  let active = -1;
  let requested = -1;
  let preload = null;
  let pendingImage = null;
  const clamp = (number, min, max) => Math.min(max, Math.max(min, number));

  function draw() {
    const scale = Math.min(window.devicePixelRatio || 1, 2);
    const width = Math.max(1, Math.round(canvas.clientWidth * scale));
    const height = Math.max(1, Math.round(canvas.clientHeight * scale));
    if (canvas.width !== width || canvas.height !== height) {
      canvas.width = width;
      canvas.height = height;
    }
    gl.viewport(0, 0, width, height);
    if (!texture) {
      gl.clearColor(.145, .157, .145, 1);
      gl.clear(gl.COLOR_BUFFER_BIT);
      return;
    }
    gl.uniform2f(uniforms.resolution, width, height);
    gl.uniform1f(uniforms.yaw, yaw);
    gl.uniform1f(uniforms.pitch, pitch);
    gl.uniform1f(uniforms.fov, fov);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  }
  function reset() {
    yaw = pitch = 0;
    fov = startFov;
    draw();
  }
  function zoom(factor) {
    fov = clamp(fov * factor, .32, 1.8);
    draw();
  }
  function cancelImage(image) {
    if (!image) return;
    image.onload = image.onerror = null;
    image.removeAttribute("src");
  }
  function scheduleNext() {
    // Let the first interactive view paint before starting the next request.
    requestAnimationFrame(() => requestAnimationFrame(() => {
      if (active !== 0 || requested !== 0 || pendingImage || preload || scenes.length < 2) return;
      const connection = navigator.connection;
      if (connection?.saveData || ["slow-2g", "2g"].includes(connection?.effectiveType)) return;
      preload = new Image();
      preload.fetchPriority = "low";
      preload.src = "photos/" + scenes[1].file;
    }));
  }
  function selectScene(index) {
    if (index === requested && pendingImage) return;
    cancelImage(pendingImage);
    pendingImage = null;
    requested = index;
    if (index === active) {
      showMessage("");
      return;
    }

    const scene = scenes[index];
    showMessage("正在載入 " + scene.label + "…");
    const usePreload = index === 1 && preload;
    const image = usePreload ? preload : new Image();
    if (!usePreload) cancelImage(preload);
    preload = null;
    pendingImage = image;

    function fail(text) {
      if (pendingImage !== image) return;
      pendingImage = null;
      showMessage(text);
    }
    function display() {
      if (pendingImage !== image) return;
      const width = image.naturalWidth;
      const height = image.naturalHeight;
      const limit = gl.getParameter(gl.MAX_TEXTURE_SIZE);
      if (width > limit || height > limit) {
        fail("這部裝置的 WebGL 紋理上限為 " + limit + "，無法顯示這張全景。");
        return;
      }
      const nextTexture = gl.createTexture();
      if (!nextTexture) {
        fail("圖形顯示暫時無法使用。請重新整理網頁。");
        return;
      }
      gl.bindTexture(gl.TEXTURE_2D, nextTexture);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
      try {
        gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, image);
        if (gl.getError() !== gl.NO_ERROR) throw new Error("Texture upload failed");
      } catch (error) {
        gl.deleteTexture(nextTexture);
        gl.bindTexture(gl.TEXTURE_2D, texture);
        fail("這張全景無法顯示。請再點一次場景，或重新整理網頁。");
        return;
      }
      if (texture) gl.deleteTexture(texture);
      texture = nextTexture;
      pendingImage = null;
      active = index;
      buttons.forEach((button, i) => button.setAttribute("aria-pressed", String(i === active)));
      sceneLabel.textContent = scene.label;
      viewer.classList.add("has-scene");
      showMessage("");
      reset();
      if (index === 0) scheduleNext();
    }
    image.onload = display;
    image.onerror = () => fail("照片無法載入。請再點一次場景重試。");
    image.fetchPriority = "high";
    if (!usePreload || (image.complete && !image.naturalWidth)) {
      image.src = "photos/" + scene.file;
    } else if (image.complete) {
      display();
    }
  }

  const buttons = scenes.map((scene, index) => {
    const button = document.createElement("button");
    button.type = "button";
    button.textContent = scene.label;
    button.setAttribute("aria-pressed", "false");
    button.onclick = () => selectScene(index);
    sceneList.append(button);
    return button;
  });
  document.querySelector("#zoom-in").onclick = () => zoom(.8);
  document.querySelector("#zoom-out").onclick = () => zoom(1.25);
  document.querySelector("#reset").onclick = reset;
  const fullscreen = document.querySelector("#fullscreen");
  fullscreen.hidden = !document.fullscreenEnabled;
  fullscreen.onclick = () => {
    const request = document.fullscreenElement ? document.exitFullscreen() : viewer.requestFullscreen();
    request.catch(() => {});
  };

  const pointers = new Map();
  function span() {
    const [a, b] = pointers.values();
    return Math.hypot(a.x - b.x, a.y - b.y);
  }
  canvas.addEventListener("pointerdown", event => {
    canvas.setPointerCapture(event.pointerId);
    pointers.set(event.pointerId, {x: event.clientX, y: event.clientY});
  });
  canvas.addEventListener("pointermove", event => {
    const old = pointers.get(event.pointerId);
    if (!old) return;
    const previousSpan = pointers.size === 2 ? span() : 0;
    pointers.set(event.pointerId, {x: event.clientX, y: event.clientY});
    if (pointers.size === 2) {
      if (previousSpan > 1) zoom(previousSpan / Math.max(1, span()));
      return;
    }
    if (pointers.size !== 1) return;
    const speed = fov / canvas.clientHeight;
    yaw -= (event.clientX - old.x) * speed;
    pitch = clamp(pitch + (event.clientY - old.y) * speed, -1.56, 1.56);
    draw();
  });
  for (const event of ["pointerup", "pointercancel", "lostpointercapture"]) {
    canvas.addEventListener(event, change => pointers.delete(change.pointerId));
  }
  canvas.addEventListener("wheel", event => {
    event.preventDefault();
    const unit = [1, 16, canvas.clientHeight][event.deltaMode] || 1;
    zoom(Math.exp(clamp(event.deltaY * unit, -300, 300) * .0015));
  }, {passive: false});
  canvas.addEventListener("keydown", event => {
    const directions = {ArrowLeft: [-.12, 0], ArrowRight: [.12, 0], ArrowUp: [0, .12], ArrowDown: [0, -.12]};
    if (!Object.hasOwn(directions, event.key)) return;
    event.preventDefault();
    const [dx, dy] = directions[event.key];
    yaw += dx;
    pitch = clamp(pitch + dy, -1.56, 1.56);
    draw();
  });
  canvas.addEventListener("webglcontextlost", event => {
    cancelImage(pendingImage);
    cancelImage(preload);
    pendingImage = preload = null;
    showMessage("圖形顯示已中斷。請重新整理網頁。");
  });
  new ResizeObserver(draw).observe(viewer);
  selectScene(0);
})();
</script>
</body>
</html>
